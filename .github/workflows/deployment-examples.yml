name: Deployment Example Harness

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Execution depth
        required: true
        type: choice
        default: Preflight
        options:
          - Preflight
          - Validate
          - Plan
          - Deploy
      example_ids:
        description: Optional comma-separated IDs (01 through 14)
        required: false
        type: string
      inputs_path:
        description: Optional repository-relative non-secret inputs JSON
        required: false
        type: string
      keep_resources:
        description: Keep test resources after verification
        required: true
        type: boolean
        default: false
      allow_tenant_admin_changes:
        description: Allow example 09 tenant-wide mutation (requires a restore manifest)
        required: true
        type: boolean
        default: false

permissions: {}

concurrency:
  group: deployment-examples-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-harness:
    name: Test and build deployment harness
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Test deployment harness
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path deployment-test-artifacts -Force | Out-Null
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force
          $configuration = New-PesterConfiguration
          $configuration.Run.Path = './deployment-tests/tests'
          $configuration.Run.Exit = $true
          $configuration.Output.Verbosity = 'Detailed'
          $configuration.TestResult.Enabled = $true
          $configuration.TestResult.OutputFormat = 'NUnitXml'
          $configuration.TestResult.OutputPath = './deployment-test-artifacts/harness-tests.xml'
          Invoke-Pester -Configuration $configuration

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: dotnet/global.json

      - name: Build udp-cicd CLI
        shell: pwsh
        run: >-
          dotnet publish ./dotnet/src/UdpCicd.Cli/UdpCicd.Cli.csproj
          --configuration Release
          --output ./deployment-test-cli

      - name: Stage udp-cicd CLI
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deployment-test-cli
          path: deployment-test-cli/
          if-no-files-found: error
          retention-days: 1

      - name: Publish harness test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deployment-harness-tests-${{ github.run_id }}
          path: deployment-test-artifacts/harness-tests.xml
          if-no-files-found: error
          retention-days: 30

  validate-examples:
    name: Validate all deployment examples
    needs: test-harness
    if: inputs.mode == 'Preflight' || inputs.mode == 'Validate'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      HARNESS_MODE: ${{ inputs.mode }}
      HARNESS_EXAMPLE_IDS: ${{ inputs.example_ids }}
      HARNESS_INPUTS_PATH: ${{ inputs.inputs_path }}
      HARNESS_KEEP_RESOURCES: ${{ inputs.keep_resources }}
      UDP_CICD_DLL: ${{ github.workspace }}/deployment-test-cli/udp-cicd.dll
      UDP_TEST_FABRIC_CAPACITY_ID: 11111111-1111-1111-1111-111111111111
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: dotnet/global.json

      - name: Download udp-cicd CLI
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: deployment-test-cli
          path: deployment-test-cli

      - name: Run deployment test suite
        id: harness
        shell: pwsh
        run: |
          $arguments = @(
            '-Mode', $env:HARNESS_MODE,
            '-OutputDirectory', (Join-Path $env:GITHUB_WORKSPACE 'deployment-test-artifacts'),
            '-CliFilePath', 'dotnet',
            '-CliPrefixArguments', $env:UDP_CICD_DLL
          )
          if (-not [string]::IsNullOrWhiteSpace($env:HARNESS_EXAMPLE_IDS)) {
            $ids = @($env:HARNESS_EXAMPLE_IDS -split '[,\s]+' | Where-Object { $_ })
            $arguments += '-ExampleId'
            $arguments += $ids
          }
          if (-not [string]::IsNullOrWhiteSpace($env:HARNESS_INPUTS_PATH)) {
            $arguments += '-InputsPath'
            $arguments += $env:HARNESS_INPUTS_PATH
          }
          if ($env:HARNESS_KEEP_RESOURCES -eq 'true') {
            $arguments += '-KeepResources'
          }
          if ($env:HARNESS_ALLOW_TENANT_ADMIN -eq 'true') {
            $arguments += '-AllowTenantAdminChanges'
          }
          & ./deployment-tests/Invoke-DeploymentTestSuite.ps1 @arguments
          exit $LASTEXITCODE

      - name: Publish deployment test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deployment-example-report-${{ github.run_id }}
          path: deployment-test-artifacts/
          if-no-files-found: error
          retention-days: 30

  deploy-examples:
    name: Plan or deploy all examples
    needs: test-harness
    if: (inputs.mode == 'Plan' || inputs.mode == 'Deploy') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    environment: deployment-tests
    permissions:
      contents: read
      id-token: write
    env:
      HARNESS_MODE: ${{ inputs.mode }}
      HARNESS_EXAMPLE_IDS: ${{ inputs.example_ids }}
      HARNESS_INPUTS_PATH: ${{ inputs.inputs_path }}
      HARNESS_KEEP_RESOURCES: ${{ inputs.keep_resources }}
      HARNESS_ALLOW_TENANT_ADMIN: ${{ inputs.allow_tenant_admin_changes }}
      UDP_CICD_DLL: ${{ github.workspace }}/deployment-test-cli/udp-cicd.dll
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: dotnet/global.json

      - name: Download udp-cicd CLI
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: deployment-test-cli
          path: deployment-test-cli

      - name: Authenticate to Azure with OIDC
        uses: Azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run deployment test suite
        id: harness
        shell: pwsh
        run: |
          $arguments = @(
            '-Mode', $env:HARNESS_MODE,
            '-OutputDirectory', (Join-Path $env:GITHUB_WORKSPACE 'deployment-test-artifacts'),
            '-CliFilePath', 'dotnet',
            '-CliPrefixArguments', $env:UDP_CICD_DLL
          )
          if (-not [string]::IsNullOrWhiteSpace($env:HARNESS_EXAMPLE_IDS)) {
            $ids = @($env:HARNESS_EXAMPLE_IDS -split '[,\s]+' | Where-Object { $_ })
            $arguments += '-ExampleId'
            $arguments += $ids
          }
          if (-not [string]::IsNullOrWhiteSpace($env:HARNESS_INPUTS_PATH)) {
            $arguments += '-InputsPath'
            $arguments += $env:HARNESS_INPUTS_PATH
          }
          if ($env:HARNESS_KEEP_RESOURCES -eq 'true') {
            $arguments += '-KeepResources'
          }
          if ($env:HARNESS_ALLOW_TENANT_ADMIN -eq 'true') {
            $arguments += '-AllowTenantAdminChanges'
          }
          & ./deployment-tests/Invoke-DeploymentTestSuite.ps1 @arguments
          exit $LASTEXITCODE
        env:
          UDP_TEST_FABRIC_CAPACITY_ID: ${{ secrets.UDP_TEST_FABRIC_CAPACITY_ID }}
          UDP_TEST_AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          UDP_TEST_ENTRA_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          UDP_TEST_ADLS_CONNECTION_ID: ${{ secrets.UDP_TEST_ADLS_CONNECTION_ID }}
          UDP_TEST_DATA_ENG_GROUP_ID: ${{ vars.UDP_TEST_DATA_ENG_GROUP_ID }}
          UDP_TEST_CONTRACTORS_GROUP_ID: ${{ vars.UDP_TEST_CONTRACTORS_GROUP_ID }}
          UDP_TEST_BI_ADMINS_GROUP_ID: ${{ vars.UDP_TEST_BI_ADMINS_GROUP_ID }}
          UDP_TEST_SLACK_WEBHOOK: ${{ secrets.UDP_TEST_SLACK_WEBHOOK }}
          PROD_DB_HOST: ${{ secrets.PROD_DB_HOST }}
          UDP_TEST_PRINCIPAL_MAPPINGS_JSON: ${{ vars.UDP_TEST_PRINCIPAL_MAPPINGS_JSON }}
          UDP_TEST_TEXT_REPLACEMENTS_JSON: ${{ vars.UDP_TEST_TEXT_REPLACEMENTS_JSON }}

      - name: Publish deployment test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deployment-example-report-${{ github.run_id }}
          path: deployment-test-artifacts/
          if-no-files-found: error
          retention-days: 30
