name: Publish Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install MkDocs
        run: pip install mkdocs==1.6.1 mkdocs-material==9.7.6

      - name: Validate documentation
        run: mkdocs build --strict

      - name: Stage generated site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mkdocs-site
          path: site/
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out published site branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: gh-pages
          persist-credentials: false

      - name: Download generated site
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mkdocs-site
          path: site

      - name: Publish to GitHub Pages branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find gh-pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a site/. gh-pages/
          touch gh-pages/.nojekyll
          cd gh-pages
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          if git diff --cached --quiet; then
            echo "Published documentation is already current."
            exit 0
          fi
          git commit -m "docs: deploy ${GITHUB_SHA}"
          git -c credential.helper='!gh auth git-credential' push origin HEAD:gh-pages
